# Finner nye testoppgaver i Altinn/altinn-auth én gang i timen (arbeidstid) og starter Son of Vegard når koden er
# klar til test: automatisk for testbare PR-er (🟢/🟡) og komplette Features, og manuelt via "/snoken"-kommentarer.
# Rapporten havner som issue her - ingenting skrives til altinn-auth.
#
# Klar til test (PR-er): merget OG deployet til miljøet (deployments i GitHub, f.eks. authorization/at22,
# regnes som ute 10 min etter registrering). Apper uten deployment-sporing: 10 min etter merge, med merknad.
# Endre ventetiden med vars.SNOKEN_DEPLOY_DELAY_MINUTES.
#
#   Skriv på en PR/issue i altinn-auth:   /snoken at22 Test trim av orgnr, maks 6 steg
#
# Kun kommentarer fra brukerne i vars.SNOKEN_ALLOWED_USERS (standard: Nyeng) teller.
# Kun i arbeidstiden: hver time kl. 07-16 norsk vintertid (08-17 sommertid), mandag-fredag.
# Kostnad: ~1 Actions-minutt per sjekk (~220/mnd). Claude brukes bare når en forespørsel finnes.
# Forespørsler fra kveld/helg plukkes opp ved første sjekk neste arbeidsdag.

name: Son of Vegard – polling (altinn-auth)

on:
  schedule:
    - cron: "17 6-15 * * 1-5" # UTC. Litt etter hel time (mindre kø hos GitHub)
  workflow_dispatch: # sjekk nå

permissions:
  contents: read
  issues: write
  actions: write # for å starte snoken.yml

jobs:
  poll:
    if: github.repository == 'Nyeng/altinn-qa-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: snoken-polling
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SNOKEN_ALLOWED_USERS: ${{ vars.SNOKEN_ALLOWED_USERS || 'Nyeng' }}
      SNOKEN_DEPLOY_DELAY_MINUTES: ${{ vars.SNOKEN_DEPLOY_DELAY_MINUTES || '10' }}
      SNOKEN_AUTO: ${{ vars.SNOKEN_AUTO || 'true' }} # 'false' slår av automatisk testing
      SNOKEN_AUTO_ENV: ${{ vars.SNOKEN_AUTO_ENV || 'at22' }}
      SNOKEN_DAILY_MAX: ${{ vars.SNOKEN_DAILY_MAX || '5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - run: node scripts/poll-altinn-auth.mjs
