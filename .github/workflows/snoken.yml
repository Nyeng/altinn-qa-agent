# Snoken i eget repo. Start en økt på to måter:
#
#  1. Kommenter på en issue her:   /snoken at23 Utforsk delegering av tilgangspakker mellom to personer
#  2. Actions → Snoken → Run workflow (velg miljø og skriv charter)
#
# Kun repo-eieren kan starte økter. Bruker repository secrets.

name: Snoken

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      env:
        description: Miljø
        type: choice
        options: [at23, at22, tt02]
        default: at23
      charter:
        description: Charter (hva Snoken skal utforske)
        type: string
        required: false
      issue:
        description: Issue her som rapporten skal postes i (valgfritt - brukes av pollingen)
        type: string
        required: false
      pr:
        description: PR-lenke i altinn-auth (valgfritt) - gir PR-beskrivelse og diff som kontekst
        type: string
        required: false
      max_steps:
        description: Maks verktøykall (tom = miljøkonfig, ellers 25)
        type: string
        required: false
      model:
        description: Modell
        type: choice
        options: [claude-sonnet-5-5, claude-opus-5-5]
        default: claude-sonnet-5-5

permissions:
  contents: read
  issues: write

jobs:
  explore:
    if: >-
      github.repository == 'Nyeng/altinn-qa-agent' && (
        github.event_name == 'workflow_dispatch' ||
        (contains(github.event.comment.body, '/snoken') && github.event.comment.author_association == 'OWNER')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: snoken-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number || inputs.issue }}
      # Brukerinput sendes som miljøvariabler - aldri interpolert direkte i run-skript.
      COMMENT_BODY: >-
        ${{ github.event_name == 'workflow_dispatch'
            && format('/snoken {0} {1}', inputs.env, inputs.charter)
            || github.event.comment.body }}
      IS_PR: ${{ github.event.issue.pull_request != null }}
      PR_REF: ${{ inputs.pr }}
      QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      QA_MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
      QA_MAX_STEPS: ${{ inputs.max_steps }}
    steps:
      - name: Kvitter med 👀
        if: github.event_name == 'issue_comment'
        run: gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes > /dev/null

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bygg charter
        id: charter
        run: node scripts/charter-from-comment.mjs

      - name: Snoken snoker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN_GENERATOR_USERNAME: ${{ secrets.TOKEN_GENERATOR_USERNAME }}
          TOKEN_GENERATOR_PASSWORD: ${{ secrets.TOKEN_GENERATOR_PASSWORD }}
          QA_CONFIG_AT22: ${{ secrets.QA_CONFIG_AT22 }}
          QA_CONFIG_AT23: ${{ secrets.QA_CONFIG_AT23 }}
          QA_CONFIG_TT02: ${{ secrets.QA_CONFIG_TT02 }}
        run: npx tsx src/explore.ts --env=${{ steps.charter.outputs.env }} reports/charter.md

      - name: Publiser rapporten
        if: success()
        run: |
          cp reports/latest.md comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          # Én rapportkommentar per issue (oppdateres ved ny kjøring) + statuslinje i issueteksten
          node scripts/publish.mjs report "$NUMBER" comment.md
          node scripts/publish.mjs status "$NUMBER" "✅ Testet $(date -u +%Y-%m-%d) i ${{ steps.charter.outputs.env }}"

      - name: Si fra om feil
        if: failure()
        run: >-
          node scripts/publish.mjs status "$NUMBER"
          "⚠️ Snoken feilet - [logg](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snoken-rapport-${{ github.run_id }}
          path: reports/
